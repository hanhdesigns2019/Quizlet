<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Foundation TOEIC Word Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;500;600&family=Charis+SIL:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a study desk — one ruled index card centred on a cool desk surface, lesson chips and mode tabs above it. */
:root{
  --desk:#e7ecf2; --card:#fffefa; --ink:#172030; --muted:#59667a; --faint:#8a96a8;
  --rule:#d6e2ef; --margin:#e2545b; --accent:#2747c4; --accent-soft:#e4e9fb; --on-accent:#ffffff;
  --ok:#147a52; --ok-bg:#dff3e9; --bad:#bf3a33; --bad-bg:#fbe6e4; --hl:#ffef9a; --hl-ink:#172030;
  --line:#cdd6e2; --chip:#ffffff; --track:#d9e0ea;
  --t1:#fde8d7; --t2:#dcefe4; --t3:#e1e7fb; --t4:#f6e1ee; --t5:#fff3c9; --t6:#dff1f6;
  --shadow:0 1px 0 rgba(23,32,48,.05),0 14px 34px -18px rgba(23,32,48,.35);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-ipa:"Charis SIL","Gentium Plus","Doulos SIL","Lucida Sans Unicode","Arial Unicode MS",serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0f141c; --card:#18202b; --ink:#e9eef5; --muted:#a2afc1; --faint:#7a889b;
  --rule:#243041; --margin:#e3666c; --accent:#93a8ff; --accent-soft:#222c48; --on-accent:#0f141c;
  --ok:#5fd3a0; --ok-bg:#163327; --bad:#ff8a80; --bad-bg:#3a1d1c; --hl:#5c4f12; --hl-ink:#fff6c9;
  --line:#2b3646; --chip:#1c2531; --track:#2a3443;
  --t1:#3a2a20; --t2:#1d3328; --t3:#232c47; --t4:#38233a; --t5:#3a3417; --t6:#1b333b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f141c; --card:#18202b; --ink:#e9eef5; --muted:#a2afc1; --faint:#7a889b;
  --rule:#243041; --margin:#e3666c; --accent:#93a8ff; --accent-soft:#222c48; --on-accent:#0f141c;
  --ok:#5fd3a0; --ok-bg:#163327; --bad:#ff8a80; --bad-bg:#3a1d1c; --hl:#5c4f12; --hl-ink:#fff6c9;
  --line:#2b3646; --chip:#1c2531; --track:#2a3443;
  --t1:#3a2a20; --t2:#1d3328; --t3:#232c47; --t4:#38233a; --t5:#3a3417; --t6:#1b333b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--margin);font-weight:600}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,40px);line-height:1;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.audio-set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg-label{font-size:12px;color:var(--faint);margin-right:2px}

/* lessons */
.lessons{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;margin:0 -2px}
.lesson{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:7px 12px 6px;text-align:left;min-width:86px}
.lesson b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.lesson span{font-size:12px;color:var(--muted)}
.lesson[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lesson[aria-pressed="true"] span{color:var(--on-accent);opacity:.85}
.subbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.part{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.part[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--chip);font-weight:600}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:120px;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:440px){.tab{font-size:11.5px}}

/* index card */
.card{position:relative;background-color:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);
  background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  background-size:100% 2px,100% 100%;background-position:0 58px,0 60px;background-repeat:no-repeat,no-repeat;
  padding:18px 22px 22px}
.card.plain{background-image:linear-gradient(var(--margin),var(--margin));background-size:100% 2px;background-position:0 58px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;height:28px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-bottom:22px}
.card-head .tag{letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.stage{display:grid;gap:14px}

.tile{width:112px;height:112px;border-radius:22px;display:grid;place-items:center;font-size:62px;line-height:1;flex:0 0 auto}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,48px);line-height:1.02;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.pos{font-family:var(--f-ipa);font-style:italic;color:var(--muted);font-size:17px}
.ipa{font-family:var(--f-ipa);font-size:20px;color:var(--ink)}
.meaning{font-size:21px;font-weight:600;line-height:1.35}
.sent{font-size:17px;line-height:1.6}
mark{background:linear-gradient(transparent 8%,var(--hl) 8%,var(--hl) 92%,transparent 92%);color:var(--hl-ink);padding:0 3px;border-radius:3px;font-weight:600}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px;color:var(--ink)}
.spk svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk:hover{border-color:var(--accent)}
.spk.big{padding:16px 22px;font-size:16px;font-weight:600}
.spk.big svg{width:30px;height:30px}
.imglink{font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.spread{justify-content:space-between}
.hint{font-size:12.5px;color:var(--faint)}

/* flip card */
.flip{display:grid;perspective:1400px;cursor:pointer}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.face.back{transform:rotateY(180deg)}
.flip.on .front{transform:rotateY(-180deg)}
.flip.on .back{transform:rotateY(0)}
.front-body{display:flex;gap:20px;align-items:center;flex-wrap:wrap;min-height:190px}
.front-text{min-width:0;flex:1 1 180px;display:grid;gap:6px}
.back-body{display:grid;gap:12px;min-height:190px;align-content:start}
.flipnote{margin:14px 0 0;text-align:right;font-size:12px;color:var(--faint)}

/* quiz */
.q-prompt{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:12px 14px;font-size:16px;min-height:56px}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--faint);margin-top:1px;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.opt.en{font-family:var(--f-display);font-weight:700;font-size:20px}
.feedback{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .fb-title{font-weight:600}
.feedback .fb-word{color:var(--ink)}

/* fill */
.blank{display:inline-block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.18em;border-bottom:2px solid var(--accent);color:var(--accent);padding:0 2px;white-space:nowrap;font-weight:600}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-size:18px}
.answer input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.answer input.right{border-color:var(--ok);background:var(--ok-bg)}
.answer input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.clue{display:flex;gap:12px;align-items:center}
.clue .tile{width:64px;height:64px;font-size:36px;border-radius:16px}
.tile .clip{width:70%;height:70%;display:block;filter:drop-shadow(0 2px 3px rgba(23,32,48,.12))}
.item .em .clip{width:30px;height:30px;display:block}
.credit{font-size:11.5px;color:var(--faint);text-align:center;margin:-8px 0 0}

/* summary */
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.missed li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.missed b{font-family:var(--f-display);font-size:18px}

/* list */
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px}
.list{display:grid;gap:0}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.item .em{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.item .w{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15}
.item .w small{font-family:var(--f-ipa);font-style:italic;font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.item .d{font-size:14px;color:var(--muted)}
.item .d .ipa{font-size:15px;margin-right:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--track);display:inline-block;margin-left:6px;vertical-align:middle}
.dot.on{background:var(--ok)}
.iconbtn{border:1px solid var(--line);background:var(--chip);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notice{font-size:13px;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 12px}
.foot{font-size:12.5px;color:var(--faint);text-align:center}
.foot kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--chip);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.face,.bar i{transition:none}}
@media (max-width:520px){
  .card{padding:16px 16px 20px}
  .tile{width:88px;height:88px;font-size:48px;border-radius:18px}
  .front-body{gap:14px}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Foundation TOEIC</div>
      <h1>Word Bank</h1>
      <p id="sub">11 bộ Quizlet Lesson</p>
    </div>
    <div class="audio-set" aria-label="Cài đặt giọng đọc">
      <span class="seg-label">Giọng</span>
      <div class="seg" id="accentSeg"><button data-v="us">Mỹ</button><button data-v="uk">Anh</button></div>
      <span class="seg-label">Tốc độ</span>
      <div class="seg" id="rateSeg"><button data-v="1">Thường</button><button data-v="0.65">Chậm</button></div>
    </div>
  </header>

  <nav class="lessons" id="lessons" aria-label="Chọn bài"></nav>
  <div class="subbar">
    <div class="parts" id="parts" aria-label="Chọn phần"></div>
    <div class="progress"><span id="progText"></span><span class="bar"><i id="progBar"></i></span></div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-mode="cards"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg>Thẻ từ</button>
    <button class="tab" role="tab" data-mode="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Trắc nghiệm</button>
    <button class="tab" role="tab" data-mode="fill"><svg viewBox="0 0 24 24"><path d="M4 18h6"/><path d="M14 18h6" stroke-dasharray="2 2"/><path d="M4 8h16M4 13h10"/></svg>Điền từ</button>
    <button class="tab" role="tab" data-mode="dict"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l4 4V6L7 10H4z"/><path d="M15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>Nghe &amp; viết</button>
    <button class="tab" role="tab" data-mode="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Danh sách</button>
  </div>

  <div id="ttsNote" class="notice" hidden>Trình duyệt này chưa phát được âm thanh. Hãy mở trang bằng Chrome, Edge hoặc Safari.</div>

  <main id="stage" class="stage" aria-live="polite"></main>

  <p class="foot" id="foot"></p>
  <p class="credit">Hình minh họa: Fluent Emoji © Microsoft, giấy phép MIT.</p>
</div>

  return `<img class="clip" src="${src}" alt="" draggable="false">`;
}

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ftwb.'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ftwb.'+k, JSON.stringify(v)); }catch(e){} }
};
const PART = 30;
const S = {
  lesson: store.get('lesson', 1),
  part: store.get('part', 0),
  mode: store.get('mode', 'cards'),
  accent: store.get('accent', 'us'),
  rate: store.get('rate', 1),

};
if (!DATA.find(l => l.n === S.lesson)) S.lesson = 1;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const key = it => it.w.toLowerCase();
const level = it => S.mastery[key(it)] || 0;
const known = it => level(it) >= 2;
const setLevel = (it, v) => { S.mastery[key(it)] = Math.max(0, Math.min(3, v)); store.set('mastery', S.mastery); updateProgress(); };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘`´]/g,"'").replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim();
const answerOf = it => (it.s.match(/\[([^\]]+)\]/) || [,it.w])[1];
const plainSent = it => it.s.replace(/[\[\]]/g,'');
const markSent = it => esc(it.s).replace(/\[([^\]]+)\]/, '<mark>$1</mark>');
const tileColor = it => { let h = 0; for (const c of it.w) h = (h*31 + c.charCodeAt(0)) >>> 0; return 'var(--t' + (h % 6 + 1) + ')'; };
const imgUrl = it => 'https://www.google.com/search?udm=2&q=' + encodeURIComponent(it.w);
const SAY = { 'read': 'red' };
const ICON_SPK = '<svg viewBox="0 0 24 24"><path d="M4 10v4h3l4 4V6L7 10H4z"/><path d="M15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>';
const ICON_SLOW = '<svg viewBox="0 0 24 24"><path d="M3 15c0-4 3.5-7 8-7s7 3 7 6v1H3z"/><path d="M18 13h2.5a1.5 1.5 0 0 0 0-3H19"/><path d="M6 15v3M14 15v3"/></svg>';

function lessonItems(){ return DATA.find(l => l.n === S.lesson).items; }
function partRanges(){
  const n = lessonItems().length, r = [];
  if (n <= 40) return [[0, n]];
  for (let a = 0; a < n; a += PART) r.push([a, Math.min(n, a + PART)]);
  const last = r[r.length - 1];
  if (last[1] - last[0] < 10 && r.length > 1){ r.pop(); r[r.length - 1][1] = n; }
  return r;
}
function partsCount(){ return partRanges().length; }
function setItems(){
  const all = lessonItems(), r = partRanges();
  if (r.length === 1 || S.part >= r.length) return all;
  return all.slice(r[S.part][0], r[S.part][1]);
}

/* ---------- audio ---------- */
const TTS = {
  ok: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined',
  voices: [],
  load(){ if (!this.ok) return; try { this.voices = speechSynthesis.getVoices() || []; } catch(e){ this.voices = []; } },
  voice(){
    const want = S.accent === 'uk' ? 'en-gb' : 'en-us';
    const v = this.voices.filter(v => (v.lang || '').toLowerCase().replace('_','-') === want);
    const pref = ['google','natural','samantha','daniel','serena','aria','jenny','libby','sonia','guy'];
    for (const p of pref){ const f = v.find(x => x.name.toLowerCase().includes(p)); if (f) return f; }
    return v[0] || this.voices.find(x => (x.lang||'').toLowerCase().startsWith('en')) || null;
  },
  speak(text, slow){
    if (!this.ok) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = S.accent === 'uk' ? 'en-GB' : 'en-US';
      const v = this.voice(); if (v) u.voice = v;
      u.rate = slow ? 0.55 : Number(S.rate) || 1;
      setTimeout(() => speechSynthesis.speak(u), 40);
    } catch(e){}
  }
};
if (TTS.ok){ TTS.load(); try { speechSynthesis.onvoiceschanged = () => TTS.load(); } catch(e){} }
else $('#ttsNote').hidden = false;
const sayWord = (it, slow) => TTS.speak(SAY[key(it)] || it.w, slow);
const saySent = (it, slow) => TTS.speak(plainSent(it), slow);

document.addEventListener('keydown', () => { S.touched = true; }, { capture: true });

function spkBtn(label, act, cls=''){ return `<button class="spk ${cls}" data-act="${act}" aria-label="${esc(label)}">${ICON_SPK}${esc(label)}</button>`; }

$('#parts').addEventListener('click', e => {

function updateProgress(){

}
$('#tabs').addEventListener('click', e => {

function renderTabs(){

/* ---------- modes ---------- */
let M = {};
function startMode(){
  renderTabs();
  const items = setItems();
  if (S.mode === 'cards') return cardsStart(items);
  if (S.mode === 'quiz') return quizStart(items);
  if (S.mode === 'fill') return typeStart(items, 'fill');

}
function head(tag, right){ return `<div class="card-head"><span class="tag">${tag}</span><span>${right}</span></div>`; }

/* Thẻ từ */
function cardsStart(items){ M = { kind:'cards', items, order: items.map((_, i) => i), i: 0, flip: false }; cardsRender(true); }
function cardsCur(){ return M.items[M.order[M.i]]; }
function cardsRender(say){

  $('#stage').innerHTML = `

        <div class="front-text">

        </div>
      </div></div>

function cardsGo(d){

function cardsDone(){

    <div style="display:grid;gap:14px">

    </div></section>`;
}

/* Trắc nghiệm */
function pickDistractors(it, field, n){
  const pool = lessonItems().filter(x => x !== it && norm(x[field]) !== norm(it[field]));
  const same = shuffle(pool.filter(x => (x.p || '')[0] === (it.p || '')[0]));
  const rest = shuffle(pool.filter(x => (x.p || '')[0] !== (it.p || '')[0]));
  const out = [], seen = new Set([norm(it[field])]);
  for (const x of same.concat(rest)){ const v = norm(x[field]); if (!seen.has(v)){ seen.add(v); out.push(x); } if (out.length === n) break; }
  return out;
}
function quizStart(items, only){
  const src = only || items;
  const queue = shuffle(src).slice(0, Math.min(20, src.length));
  M = { kind:'quiz', items, queue, i: 0, right: 0, missed: [], retry: [], answered: false, total: queue.length };
  quizNext();
}
function quizNext(){
  if (M.i >= M.queue.length){
    if (M.retry.length){ M.queue = M.queue.concat(M.retry); M.retry = []; }
    else return quizDone();
  }
  const it = M.queue[M.i];
  const type = (M.i % 3 === 2) ? 'vn' : 'ctx';
  const field = type === 'ctx' ? 'm' : 'w';
  const opts = shuffle([it].concat(pickDistractors(it, field, 3)));
  M.q = { it, type, opts }; M.answered = false;
  const n = M.queue.length;
  const prompt = type === 'ctx'
    ? `<div class="q-prompt">Từ được tô trong câu có nghĩa là gì?</div><div class="sent" style="font-size:19px">${markSent(it)}</div>`
    : `<div class="q-prompt">Chọn từ tiếng Anh có nghĩa</div><div class="meaning" style="font-size:24px">${esc(it.m)}</div>`;
  $('#stage').innerHTML = `
  <section class="card">
    ${head('Trắc nghiệm · Lesson ' + S.lesson, `Câu ${M.i + 1}/${n} · đúng ${M.right}`)}
    <div style="display:grid;gap:16px">
      ${prompt}
      <div class="opts">${opts.map((o, j) => `<button class="opt ${type === 'vn' ? 'en' : ''}" data-opt="${j}"><span class="k">${j + 1}</span><span>${esc(type === 'ctx' ? o.m : o.w)}</span></button>`).join('')}</div>
      <div id="fb"></div>
    </div>
  </section>
  <div class="row">${type === 'ctx' ? spkBtn('Nghe câu', 'qsays') : ''}</div>`;
  if (type === 'ctx' && S.touched) saySent(it);
}
function quizAnswer(j){
  if (M.answered) return;
  M.answered = true;
  const { it, opts } = M.q, ok = opts[j] === it;
  document.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (opts[k] === it) b.classList.add('right'); else if (k === j) b.classList.add('wrong'); });
  if (ok){ if (M.i < M.total) M.right++; setLevel(it, level(it) + 1); }
  else { setLevel(it, 0); if (!M.missed.includes(it)) M.missed.push(it); M.retry.push(it); }
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}">
      <span class="fb-title">${ok ? 'Chính xác!' : 'Chưa đúng. Từ này sẽ được hỏi lại.'}</span>
      <span class="fb-word"><b>${esc(it.w)}</b> <span class="ipa" style="font-size:16px">${esc(it.i)}</span> · ${esc(it.m)}</span>
    </div>
    <div class="btns" style="margin-top:12px"><button class="btn primary" data-act="qnext">Câu tiếp →</button>${spkBtn('Nghe từ', 'qsayw')}</div>`;
  sayWord(it);
  const nb = document.querySelector('[data-act="qnext"]'); if (nb) nb.focus({ preventScroll: true });
}
function quizDone(){ summary('Trắc nghiệm', M.right, M.total, M.missed, 'quiz'); }

/* Điền từ + Nghe & viết */
function blankOf(ans, shown){
  let k = 0;
  return ans.split('').map(c => { if (c === ' ') return ' '; const out = k < shown ? c : '_'; k++; return out; }).join('');
}
function typeStart(items, kind, only){
  const src = only || items;
  const queue = shuffle(src).slice(0, Math.min(20, src.length));
  M = { kind, items, queue, i: 0, right: 0, missed: [], total: queue.length, shown: 0, answered: false };
  typeNext();
}
function typeTarget(it){ return M.kind === 'fill' ? answerOf(it) : (it.w); }
function typeNext(){
  if (M.i >= M.queue.length) return summary(M.kind === 'fill' ? 'Điền từ' : 'Nghe & viết', M.right, M.total, M.missed, M.kind);
  const it = M.queue[M.i], n = M.queue.length;
  M.shown = 0; M.answered = false;
  const body = M.kind === 'fill' ? `
      <div class="q-prompt">Điền từ còn thiếu vào câu</div>
      <div class="sent" style="font-size:19px" id="fsent">${fillSent(it)}</div>
      <div class="clue"><div class="tile" style="background:${tileColor(it)}" aria-hidden="true">${art(it)}</div><div><div class="meaning" style="font-size:18px">${esc(it.m)}</div><div class="pos">${esc(it.p)}</div></div></div>`
    : `
      <div class="q-prompt">Nghe và viết lại từ bạn nghe được</div>
      <div class="row">${spkBtn('Nghe', 'dsay', 'big')}${slowBtn('dslow')}</div>
      <div class="hint" id="dclue">Gợi ý: <span class="blank">${blankOf(it.w, 0)}</span></div>`;
  $('#stage').innerHTML = `
  <section class="card">
    ${head((M.kind === 'fill' ? 'Điền từ' : 'Nghe & viết') + ' · Lesson ' + S.lesson, `Câu ${M.i + 1}/${n} · đúng ${M.right}`)}
    <div style="display:grid;gap:16px">
      ${body}
      <form class="answer" id="ansForm" autocomplete="off">
        <input id="ans" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Gõ từ tiếng Anh…" aria-label="Câu trả lời">
        <button class="btn primary" type="submit" id="checkBtn">Kiểm tra</button>
      </form>
      <div class="btns"><button class="btn" data-act="thint">Gợi ý 1 chữ cái</button><button class="btn" data-act="tskip">Bỏ qua</button></div>
      <div id="fb"></div>
    </div>
  </section>`;
  $('#ansForm').addEventListener('submit', e => { e.preventDefault(); M.answered ? (M.i++, typeNext()) : typeCheck(); });
  const inp = $('#ans'); if (window.matchMedia && window.matchMedia('(pointer:fine)').matches) inp.focus({ preventScroll: true });
  if (M.kind === 'dict' && S.touched) sayWord(it);
}
function fillSent(it, reveal){
  const ans = answerOf(it);
  return esc(it.s).replace(/\[([^\]]+)\]/, reveal ? `<mark>${esc(ans)}</mark>` : `<span class="blank">${blankOf(ans, M.shown)}</span>`);
}
function typeHint(){
  if (M.answered) return;
  const it = M.queue[M.i], target = typeTarget(it);
  const letters = target.replace(/ /g, '').length;
  M.shown = Math.min(letters, M.shown + 1); M.hinted = true;
  if (M.kind === 'fill') $('#fsent').innerHTML = fillSent(it);
  else $('#dclue').innerHTML = `Gợi ý: <span class="blank">${blankOf(it.w, M.shown)}</span>`;
}
function typeCheck(skip){
  const it = M.queue[M.i], target = typeTarget(it);
  const val = skip ? '' : $('#ans').value;
  if (!skip && !val.trim()){ $('#ans').focus(); return; }
  const ok = !skip && (norm(val) === norm(target) || (M.kind === 'dict' && norm(val) === norm(answerOf(it))));
  M.answered = true;
  $('#ans').classList.add(ok ? 'right' : 'wrong'); $('#ans').readOnly = true;
  $('#checkBtn').textContent = 'Câu tiếp →';
  document.querySelector('[data-act="thint"]').disabled = true; document.querySelector('[data-act="tskip"]').disabled = true;
  if (ok){ M.right++; setLevel(it, level(it) + (M.shown ? 0 : 1)); } else { setLevel(it, 0); M.missed.push(it); }
  if (M.kind === 'fill') $('#fsent').innerHTML = fillSent(it, true);
  else $('#dclue').innerHTML = `Đáp án: <b style="color:var(--ink)">${esc(it.w)}</b>`;
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}">
      <span class="fb-title">${ok ? (M.shown ? 'Đúng rồi (có dùng gợi ý).' : 'Chính xác!') : `Đáp án đúng: ${esc(target)}`}</span>
      <span class="fb-word"><b>${esc(it.w)}</b> <span class="ipa" style="font-size:16px">${esc(it.i)}</span> · ${esc(it.m)}</span>
      ${M.kind === 'dict' ? `<span class="fb-word" style="font-size:14px">${markSent(it)}</span>` : ''}
    </div>
    <div class="row" style="margin-top:12px">${spkBtn('Nghe từ', 'tsayw')}${spkBtn('Nghe câu', 'tsays')}</div>`;
  if (M.kind === 'fill') saySent(it); else sayWord(it);
  $('#checkBtn').focus({ preventScroll: true });
}

/* Tổng kết */
function summary(title, right, total, missed, mode){
  M = Object.assign(M, { done: true, lastMissed: missed, lastMode: mode });
  $('#stage').innerHTML = `<section class="card">${head(title + ' · kết quả', 'Lesson ' + S.lesson)}
    <div style="display:grid;gap:16px">
      <div><div class="score">${right}/${total}</div><p class="hint" style="font-size:14px;margin:6px 0 0">${right === total ? 'Làm đúng hết. Rất tốt!' : 'câu trả lời đúng ngay lần đầu'}</p></div>
      ${missed.length ? `<div><div class="q-prompt" style="margin-bottom:6px">Từ cần ôn lại (${missed.length})</div><ul class="missed">${missed.map((it, i) => `<li><b>${esc(it.w)}</b><span class="ipa" style="font-size:15px">${esc(it.i)}</span><span>${esc(it.m)}</span><button class="iconbtn" data-act="missay" data-i="${i}" aria-label="Nghe ${esc(it.w)}">${ICON_SPK}</button></li>`).join('')}</ul></div>` : ''}
      <div class="btns">${missed.length ? '<button class="btn primary" data-act="redoMissed">Làm lại các từ sai</button>' : ''}<button class="btn ${missed.length ? '' : 'primary'}" data-act="redo">Làm lượt mới</button></div>
    </div></section>`;
}

/* Danh sách */
function listRender(items){
  M = { kind:'list', items, q: '' };
  $('#stage').innerHTML = `<input class="search" id="search" type="search" placeholder="Tìm từ hoặc nghĩa…" aria-label="Tìm từ">
    <section class="card plain" style="padding-top:18px">${head('Danh sách từ · Lesson ' + S.lesson, items.length + ' từ')}<div class="list" id="list"></div></section>`;
  $('#search').addEventListener('input', e => { M.q = e.target.value; listFill(); });
  listFill();
}
function listFill(){
  const q = norm(M.q);
  const rows = M.items.map((it, i) => ({ it, i })).filter(({ it }) => !q || norm(it.w).includes(q) || norm(it.m).includes(q));
  $('#list').innerHTML = rows.length ? rows.map(({ it, i }) => `<div class="item">
      <div class="em" style="background:${tileColor(it)}" aria-hidden="true">${art(it)}</div>
      <div style="min-width:0"><div class="w">${esc(it.w)}<small>${esc(it.p)}</small><span class="dot ${known(it) ? 'on' : ''}" title="${known(it) ? 'Đã thuộc' : 'Chưa thuộc'}"></span></div>
        <div class="d"><span class="ipa">${esc(it.i)}</span>${esc(it.m)}</div></div>
      <button class="iconbtn" data-act="lsay" data-i="${i}" aria-label="Nghe ${esc(it.w)}">${ICON_SPK}</button></div>`).join('')
    : '<p class="hint" style="padding:12px 0">Không tìm thấy từ nào khớp.</p>';
}

/* ---------- events ---------- */
$('#stage').addEventListener('click', e => {
  if (e.target.closest('#flip')){ flipCard(); return; }
  const o = e.target.closest('[data-opt]'); if (o){ quizAnswer(Number(o.dataset.opt)); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a){
    case 'sayw': sayWord(cardsCur()); break;
    case 'sayslow': sayWord(cardsCur(), true); break;
    case 'says': saySent(cardsCur()); break;
    case 'prev': cardsGo(-1); break;
    case 'next': cardsGo(1); break;
    case 'shuffle': M.order = shuffle(M.order); M.i = 0; M.flip = false; cardsRender(true); break;
    case 'known': setLevel(cardsCur(), 3); cardsGo(1); break;
    case 'unknown': setLevel(cardsCur(), 0); cardsGo(1); break;
    case 'again': cardsStart(setItems()); break;
    case 'againUnknown': { const u = setItems().filter(x => !known(x)); M = { kind:'cards', items: u, order: u.map((_, i) => i), i: 0, flip: false }; cardsRender(true); break; }
    case 'toQuiz': S.mode = 'quiz'; store.set('mode', 'quiz'); startMode(); break;
    case 'qsays': saySent(M.q.it); break;
    case 'qsayw': sayWord(M.q.it); break;
    case 'qnext': M.i++; quizNext(); break;
    case 'dsay': sayWord(M.queue[M.i]); break;
    case 'dslow': sayWord(M.queue[M.i], true); break;
    case 'thint': typeHint(); break;
    case 'tskip': typeCheck(true); break;
    case 'tsayw': sayWord(M.queue[M.i]); break;
    case 'tsays': saySent(M.queue[M.i]); break;
    case 'missay': sayWord(M.lastMissed[Number(b.dataset.i)]); break;
    case 'redoMissed': { const ms = M.lastMissed.slice(), items = setItems(); if (M.lastMode === 'quiz') quizStart(items, ms); else typeStart(items, M.lastMode, ms); break; }
    case 'redo': startMode(); break;
    case 'lsay': sayWord(M.items[Number(b.dataset.i)]); break;
  }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (M.kind === 'cards' && !M.done && $('#flip')){
    if (e.key === ' ' || (e.key === 'Enter' && e.target.id === 'flip')){ e.preventDefault(); flipCard(); }
    else if (e.key === 'ArrowRight') cardsGo(1);
    else if (e.key === 'ArrowLeft' && M.i > 0) cardsGo(-1);
    else if (e.key.toLowerCase() === 's') sayWord(cardsCur());
  } else if (M.kind === 'quiz' && M.q && $('.opts')){
    if (/^[1-4]$/.test(e.key)) quizAnswer(Number(e.key) - 1);
    else if (e.key === 'Enter' && M.answered && tag !== 'button'){ e.preventDefault(); M.i++; quizNext(); }
  }
});

/* ---------- boot ---------- */
renderSeg(); renderLessons(); renderParts(); startMode();
const active = document.querySelector('.lesson[aria-pressed="true"]'); if (active){ const L = $('#lessons'); L.scrollLeft = Math.max(0, active.getBoundingClientRect().left - L.getBoundingClientRect().left - 24); }
</script>
